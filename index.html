```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub Actions Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: white;
            background:
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.25), transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.25), transparent 30%),
                #080b14;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
        }

        .circle.one {
            width: 500px;
            height: 500px;
            top: -250px;
            left: -150px;
        }

        .circle.two {
            width: 700px;
            height: 700px;
            bottom: -400px;
            right: -250px;
        }

        .container {
            width: min(1000px, 90%);
            position: relative;
            z-index: 2;
        }

        .card {
            padding: 70px 60px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(15px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
        }

        .badge {
            display: inline-block;
            padding: 8px 16px;
            margin-bottom: 25px;
            border-radius: 50px;
            font-size: 13px;
            letter-spacing: 1px;
            color: #93c5fd;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.25);
        }

        h1 {
            font-size: clamp(42px, 7vw, 76px);
            line-height: 1;
            margin-bottom: 22px;
            background: linear-gradient(90deg, #ffffff, #93c5fd, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            max-width: 700px;
            margin: auto;
            color: #a8b3c7;
            font-size: 19px;
            line-height: 1.7;
        }

        .pipeline {
            margin: 45px auto 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .step {
            padding: 12px 18px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #dbeafe;
            font-size: 14px;
        }

        .arrow {
            color: #64748b;
            font-size: 18px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 18px;
            border-radius: 50px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            color: #86efac;
            font-size: 14px;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 12px #22c55e;
        }

        footer {
            margin-top: 35px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 45px 25px;
            }

            .subtitle {
                font-size: 16px;
            }

            .arrow {
                display: none;
            }

            .pipeline {
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="background">
        <div class="circle one"></div>
        <div class="circle two"></div>
    </div>

    <main class="container">

        <section class="card">

            <div class="badge">
                DEVOPS CLASSROOM DEMO
            </div>

            <h1>GitHub Actions</h1>

            <p class="subtitle">
                Welcome to our CI/CD demonstration.
                This website is automatically served through a
                GitHub Actions workflow.
            </p>

            <div class="pipeline">

                <div class="step">Git Push</div>

                <div class="arrow">→</div>

                <div class="step">GitHub</div>

                <div class="arrow">→</div>

                <div class="step">Actions</div>

                <div class="arrow">→</div>

                <div class="step">Build</div>

                <div class="arrow">→</div>

                <div class="step">Deploy</div>

            </div>

            <div class="status">
                <span class="dot"></span>
                Pipeline Ready
            </div>

            <footer>
                Learning CI/CD with GitHub Actions
            </footer>

        </section>

    </main>

</body>
</html>
```
